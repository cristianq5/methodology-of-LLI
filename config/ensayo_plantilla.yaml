# =====================================================================
# FICHA DE ENSAYO (plantilla). Copia este fichero, rellénalo y lánzalo:
#   python python/pipeline/run_pipeline.py --ensayo mi_ensayo.yaml
#   Rscript R/pipeline/run_pipeline.R --ensayo mi_ensayo.yaml
#
# Aquí va SOLO lo propio del ensayo. Los parámetros del método están en parametros.yaml y se
# pueden sobrescribir en la sección "ajustes:" del final.
# Las rutas relativas se resuelven desde la carpeta donde está ESTA ficha.
# Los datos de entrada se leen en modo solo lectura: el pipeline nunca los modifica.
# =====================================================================

ensayo:
  nombre: "mi_ensayo"                      # se usa en logs y en la copia de la configuración
  descripcion: ""                          # texto libre (finca, fecha, bloque, manejo...)

entradas:
  las: 'datos/nube.las'                    # nube de puntos del RS30 (LAS/LAZ con gps_time)
  brutos: 'datos/brutos'                   # carpeta de la captura tal cual la exporta el RS30 (SLAM_DATA, POST_SLAM_DATA, GPS, SCAN)
  # Opcional: ficheros concretos de los brutos. Si se dejan vacíos, se buscan dentro de "brutos":
  #   trayectoria_posi -> SLAM_DATA/*.PosI
  #   trayectoria_hf   -> POST_SLAM_DATA/result_trajectory3d_high_freq.txt
  #   rtk_gga          -> GPS/Rtk/rtk.gga       (solo para el control de calidad; si falta, se avisa)
  #   pcap             -> SCAN/Scanner1/*.pcap
  #   calib_ep         -> SCAN/Scanner1/*.EP    (LAS-1.EP; necesario con la calibración global y elevaciones "EP")
  # Si hay más de un candidato, el pipeline se para y pide que se indique aquí.
  # Organización de la carpeta y formato de cada fichero: docs/ENTRADAS.md
  brutos_archivos:
    trayectoria_posi: null
    trayectoria_hf: null
    rtk_gga: null
    pcap: null
    calib_ep: null

croquis:
  ruta: 'datos/hileras.gpkg'               # capa vectorial de LÍNEAS: una línea por hilera, sobre su eje (GPKG, SHP...)
  capa: null                               # nombre de la capa (null = la única o la primera)
  campo_id: "id_fila"                      # campo que identifica cada hilera
  atributos: ["variedad", "bloque", "tratamiento"]   # campos que se copian a todos los resultados (los que tenga el archivo vectorial)
  filtro: {}                               # hileras que se procesan, p. ej. {bloque: 1, tratamiento: "riego"} (vacío = todas)
  normalizar_texto: true                   # quita espacios y pasa a minúsculas los atributos de texto (en memoria)
  reemplazos: {}                           # correcciones de erratas en memoria, p. ej. {variedad: {arbosona: arbosana}}
  id_compuesto: false                      # true si campo_id se repite: el id pasa a ser campo_id + atributos

crs:
  epsg: null                               # EPSG proyectado (m) del LAS y del archivo vectorial. null = el de la cabecera del LAS.
                                           # Si el archivo vectorial está en otro CRS, se reproyecta en memoria.

ejecucion_ensayo:
  modo: "prueba"                           # "prueba" (tramo corto de pocas hileras, para revisar) | "completo"
  hileras_prueba: []                       # ids de 1-3 hileras vecinas para el modo prueba
  tramo_prueba_s_m: [10.0, 22.0]           # tramo (m desde el inicio de la línea del archivo vectorial) en modo prueba

salidas:
  carpeta: 'salidas'                       # resultados de Python; R escribe en <carpeta>_R
  logs: null                               # null = <carpeta>/logs

# Opcional: valores de parametros.yaml que cambian en este ensayo (misma estructura). Ejemplo:
# ajustes:
#   hilera:
#     buffer_m: 1.25                       # calles más estrechas
#   qc:
#     distancia_tray_eje_esperada_m: [0.8, 2.5]
ajustes: {}
