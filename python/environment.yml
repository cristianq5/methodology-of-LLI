# Entorno conda del pipeline LLI. Versiones mínimas = las probadas en Windows 11
# (python 3.11.16, numpy 2.4.6, scipy 1.17.1, pandas 3.0.5, pdal 2.10 / python-pdal 3.5.3, gdal 3.12.3,
# rasterio 1.4.4, geopandas 1.1.4, pyogrio 0.12.1, laspy 2.7.0, lazrs-python 0.8.2). Por qué cada una: python/README.md
# Instalar:  conda env create -f python/environment.yml
name: lidar-agrolab
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=2.0
  - scipy>=1.11
  - pandas>=2.0
  - pyyaml>=6.0
  - laspy>=2.5
  - lazrs-python>=0.5     # solo para escribir .laz (exportar.comprimir_laz)
  - pdal>=2.6
  - python-pdal>=3.4
  - gdal>=3.8
  - rasterio>=1.3
  - geopandas>=0.14
  - pyogrio>=0.7
  - shapely>=2.0
  - pyproj>=3.6
  - matplotlib>=3.8
  - pillow>=10.0
  - psutil>=5.9
